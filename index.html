<body>
  <div id="splash" class="splash" aria-live="polite">
    <img class="splash-art" src="/pikk-app/loading/DBS_Official_Loading_Screen.png" alt="PIKK Loading" />
    <p class="splash-credit">Made by Cox Creations</p>
  </div>
  <div class="demo-ribbon" id="testRibbon">TEST MODE · NO REAL CHARGES · LOCAL DEMO</div>
  <header class="top" id="topBar">
    <a href="#/home" class="logo" aria-label="PIKK Home">

    </a>
    <div class="top-actions">
      <a class="pill tier-pill" id="tierPill" href="#/profile">Sign in</a>
      <button class="icon-btn" id="notifBtn" aria-label="Notifications" title="Notifications">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 22a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2zm6-6V11a6 6 0 1 0-12 0v5l-2 2v1h16v-1l-2-2z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      </button>
      <button class="icon-btn" id="menuBtn" aria-label="Menu">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>
  <nav class="side" id="sideNav" aria-hidden="true"></nav>
  <div class="scrim" id="scrim"></div>
  <main id="app"></main>
  <footer class="foot">
    <p>TEST MODE: no cards charged. Catalog and merch links are demo placeholders.</p>
    <p class="credit">Built by <a href="https://cox-creations-studio.pages.dev/" target="_blank" rel="noopener">Cox Creations Studio</a></p>
  </footer>
  <div class="mini-player" id="miniPlayer" aria-label="Mini player">
    <img class="art" id="mpArt" src="/pikk-app/music/01_Long_Story_Short_Coming_Soon.jpg" alt="" />
    <div class="meta">
      <div class="mp-title" id="mpTitle">Long Story Short</div>
      <div class="mp-sub" id="mpSub">DatBoiSkeet · Coming Soon</div>
      <div class="prog"><i id="mpProg"></i></div>
    </div>
    <button class="play" id="mpPlay" aria-label="Play / Pause">▶</button>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Primary"></nav>
  <div class="toast" id="toast" role="status"></div>
