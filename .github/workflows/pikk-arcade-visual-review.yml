name: PIKK Arcade Visual Review (no deploy)
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/games.js'
      - 'src/pages/home.js'
      - 'src/games/arcade-catalog.js'
      - 'src/styles.css'
      - '.github/workflows/pikk-arcade-visual-review.yml'
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Verify app features
        run: npm test
      - name: Build GitHub Pages preview
        run: npm run build
        env:
          VITE_BASE: /pikk-app/
      - name: Install browser for visual evidence
        run: npx --yes playwright@1.58.2 install --with-deps chromium
      - name: Start local preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/pikk-preview.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:4173/pikk-app/ > /dev/null && exit 0; sleep 1; done
          cat /tmp/pikk-preview.log
          exit 1
      - name: Capture Arcade and Home on mobile and desktop
        run: |
          mkdir -p visual-evidence
          npx --yes playwright@1.58.2 screenshot --browser chromium --viewport-size="390,844" --wait-for-timeout=1500 --full-page "http://127.0.0.1:4173/pikk-app/#/games" visual-evidence/arcade-mobile.png
          npx --yes playwright@1.58.2 screenshot --browser chromium --viewport-size="1440,900" --wait-for-timeout=1500 --full-page "http://127.0.0.1:4173/pikk-app/#/games" visual-evidence/arcade-desktop.png
          npx --yes playwright@1.58.2 screenshot --browser chromium --viewport-size="390,844" --wait-for-timeout=1500 "http://127.0.0.1:4173/pikk-app/#/home" visual-evidence/home-mobile.png
      - name: Upload visual evidence (not a deployment)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pikk-arcade-visual-evidence
          path: visual-evidence/*.png
          if-no-files-found: warn
          retention-days: 7
