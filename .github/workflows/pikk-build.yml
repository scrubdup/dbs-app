name: PIKK build verification
on:
  push:
    branches: [pikk-rebrand, master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pikk-pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Verify PIKK HTML build
        run: |
          test -f dist/index.html
          grep -q 'PIKK' dist/index.html
          grep -q '/dbs-app/' dist/index.html

      - name: Publish tested build to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/pikk-rebrand'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          keep_files: false
